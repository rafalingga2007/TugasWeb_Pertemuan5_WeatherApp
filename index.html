<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi untuk mencari informasi cuaca kota menggunakan OpenWeatherMap API.">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="weather-app">
    <header class="app-header">
      <p class="eyebrow">CUACA HARI INI</p>
      <h1>Weather<span>App</span></h1>
      <p class="subtitle">Cari tahu cuaca kota pilihanmu.</p>
    </header>

    <form id="searchForm" class="search-form">
      <label class="visually-hidden" for="cityInput">Nama kota</label>
      <input id="cityInput" type="text" placeholder="Contoh: Medan" autocomplete="off" required>
      <button type="submit">Cari</button>
    </form>

    <p id="loading" class="status" hidden>⏳ Sedang mengambil data cuaca...</p>
    <p id="error" class="error" role="alert" aria-live="polite"></p>

    <section id="weatherResult" class="weather-result" hidden aria-live="polite">
      <p id="dateLabel" class="date-label"></p>
      <h2 id="cityName"></h2>
      <img id="weatherIcon" alt="Ikon kondisi cuaca" width="100" height="100">
      <p id="temperature" class="temperature"></p>
      <p id="description" class="description"></p>
      <div class="details">
        <div class="detail-card">
          <span class="detail-icon">💧</span>
          <span class="detail-label">Kelembapan</span>
          <strong id="humidity">—</strong>
        </div>
        <div class="detail-card">
          <span class="detail-icon">🌬️</span>
          <span class="detail-label">Kecepatan angin</span>
          <strong id="wind">—</strong>
        </div>
      </div>
    </section>

    <section class="history-section">
      <div class="section-heading">
        <h3>Riwayat pencarian</h3>
        <button id="clearHistory" class="text-button" type="button">Hapus</button>
      </div>
      <ul id="history" class="history-list"></ul>
      <p id="emptyHistory" class="empty-history">Kota yang dicari akan muncul di sini.</p>
    </section>

    <footer>Data cuaca oleh OpenWeatherMap</footer>
  </main>
</body>
</html>
